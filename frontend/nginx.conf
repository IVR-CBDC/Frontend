# Конфиг nginx для продового образа SPA (frontend/Dockerfile). Раздаёт
# статику сборки и проксирует те же пути, что и dev-прокси Vite
# (vite.config.ts) — /api и /ws на BFF, чтобы SPA не знала о разнице между
# режимами.

# F10 (final review): включаем gzip для текстовых ответов — статика SPA
# (бандлы JS/CSS) без этого едет несжатой.
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 512;

# F11 (final review): nginxinc/nginx-unprivileged слушает 8080 (не может
# привязаться к :80 без root) — см. Dockerfile и Backend-репозиторий
# (docker-compose.yml, healthcheck сервиса frontend).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг на клиенте (react-router-dom): прямая ссылка на
    # внутренний маршрут вроде /deals/:id/tracking — это не файл на диске,
    # без fallback nginx отдаст 404. Отдаём index.html, дальше маршрутизирует
    # сам SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # F10 (final review): index.html раньше отдавался только с
    # Last-Modified/ETag — браузер применяет эвристическое кеширование, и
    # после выката в k3s вернувшийся пользователь получает закешированный
    # index.html, ссылающийся на исчезнувшие хэшированные бандлы (белый
    # экран без выхода, кроме жёсткой перезагрузки). no-cache — не "не
    # кешировать вовсе", а "всегда перевалидировать через ETag" (дёшево,
    # почти всегда 304).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Хэшированные бандлы (vite ставит контент-хэш в имя файла) — если
    # содержимое изменилось, изменится и URL, поэтому кешировать их можно
    # бессрочно и без перевалидации.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker и его регистратор от vite-plugin-pwa (registerType:
    # autoUpdate) — тот же риск, что у index.html: закешированный sw.js
    # продолжит обслуживать старую версию приложения из своего кеша сколько
    # угодно долго, если браузер не перевалидирует его вовремя.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # BFF — единственная дверь из SPA в бэкенд (см. README «Контракт для
    # SPA»). Имя сервиса "bff" резолвится через Docker DNS внутри сети
    # compose-стенда (backend-net).
    location /api/ {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Живые обновления сделок: без Upgrade/Connection апгрейд до WebSocket
    # не пройдёт, соединение молча не установится, и SPA просто не получит
    # ни connection.ack, ни DealEvent — внешне это выглядит как рабочее
    # приложение, которое никогда не обновляется (см. README «Контракт для
    # SPA», правило перезапроса).
    location /ws {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
