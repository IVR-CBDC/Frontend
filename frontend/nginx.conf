# Конфиг nginx для продового образа SPA (frontend/Dockerfile). Раздаёт
# статику сборки и проксирует те же пути, что и dev-прокси Vite
# (vite.config.ts) — /api и /ws на BFF, чтобы SPA не знала о разнице между
# режимами.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг на клиенте (react-router-dom): прямая ссылка на
    # внутренний маршрут вроде /deals/:id/tracking — это не файл на диске,
    # без fallback nginx отдаст 404. Отдаём index.html, дальше маршрутизирует
    # сам SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BFF — единственная дверь из SPA в бэкенд (см. README «Контракт для
    # SPA»). Имя сервиса "bff" резолвится через Docker DNS внутри сети
    # compose-стенда (backend-net).
    location /api/ {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Живые обновления сделок: без Upgrade/Connection апгрейд до WebSocket
    # не пройдёт, соединение молча не установится, и SPA просто не получит
    # ни connection.ack, ни DealEvent — внешне это выглядит как рабочее
    # приложение, которое никогда не обновляется (см. README «Контракт для
    # SPA», правило перезапроса).
    location /ws {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
