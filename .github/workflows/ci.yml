name: CI

# Тот же паттерн триггеров, что в Backend-репозитории (см.
# IVR-CBDC/Backend .github/workflows/ci.yml): pull_request + push кроме
# main (там уже подразумевается отдельный deploy-воркфлоу, гонять полный
# набор тестов второй раз сразу после мержа не нужно).
on:
  pull_request:
  push:
    branches-ignore:
      - main

# Та же причина, что у Backend-репозитория: без concurrency серия пушей в
# одну ветку выстраивает очередь джоб — каждый новый пуш ждёт, пока
# отработает предыдущий. group завязана на ветку/PR, cancel-in-progress
# отменяет устаревший прогон при новом пуше в тот же ref.
#
# F7 (final review): раньше здесь стояло "особенно e2e, ~4 минуты стенда +
# Playwright" — верно только при уже тёплом GHA-кэше `ivr-cpp-base`.
# service-auth/service-core собираются поверх него полным `cmake && make`
# при каждом `up -d --build` внутри `make e2e-stand-up`, и никакой
# cache-from до этой сборки не доходил — на чистом раннере это было ~25-40
# минут на джобу, а не 4.
#
# План 08 (Task 4): вылечено. service-auth/service-core/service-commission
# больше здесь не собираются — CD Backend публикует их в ghcr, а джоба e2e
# тянет готовые образы по плавающему тегу `:main` (см. шаг «Pull backend
# images» ниже). Собираются только bff и frontend — то, что этот репозиторий
# и меняет. Сколько это занимает на самом деле, измерить здесь нельзя:
# раннера нет, джоба ни разу не выполнялась.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # bff: install --frozen-lockfile, typecheck, test (vitest, upstream'ы
  # подменены — стенд не нужен), build (tsc -> dist).
  # ============================================================
  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Та же версия, что зафиксирована в bff/Dockerfile и
          # frontend/Dockerfile через `corepack prepare pnpm@11.3.0` — иначе
          # --frozen-lockfile может разойтись с резолвером, которым лочился
          # pnpm-lock.yaml.
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: bff/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ============================================================
  # frontend: то же самое для SPA (vitest + jsdom, без сети).
  # ============================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ============================================================
  # e2e: полный стенд (Backend-репозиторий + bff/frontend, собранные из
  # этого чекаута) + Playwright против него.
  #
  # ЧЕСТНО (план 07, задача 3): эта джоба НЕ МОЖЕТ выполниться до тех пор,
  # пока ни у одного из двух репозиториев нет git remote — шаг ниже
  # `actions/checkout` с `repository: IVR-CBDC/Backend` обращается к
  # реальному GitHub-репозиторию по имени, которого сейчас не существует
  # (оба репозитория только локальные, `/home/legors/Documents/IVR` и
  # `/home/legors/Documents/alfa-cbdc-hub`). Она не запускалась и не
  # проходила на раннере — написана и верифицирована локально: разобрана
  # парсером YAML (`python3 -c "import yaml; ..."`), шаги (сборка образов
  # bff/frontend/ivr-cpp-base, `make e2e-stand-up` в backend/, `pnpm test` в
  # e2e/) воспроизведены вручную командной строкой против настоящего стенда,
  # включая явную проверку на раннере "как с нуля" (образ `ivr-cpp-base`
  # удалён и пересобран заново тем же шагом, что ниже, а не унаследован от
  # более ранней работы на этой машине — см. отчёт задачи 3, Addendum). Когда
  # Backend-репозиторий получит remote
  # (`IVR-CBDC/Backend`) и станет доступен для checkout из этого workflow
  # (публичный репозиторий или secrets.BACKEND_CHECKOUT_TOKEN для
  # приватного), эта джоба должна заработать без дополнительных правок —
  # если нет, это находка для следующего прогона, а не повод переписывать
  # её вслепую.
  #
  # F2 (final review, требование к порядку мержа): `make e2e-stand-up`
  # существует только в ветке Backend-репозитория `feat/e2e-support`
  # (создана Task 3 плана 07), не в его ветке по умолчанию (`main`). Эта
  # джоба чекаутит Backend без `ref:` — то есть его ветку по умолчанию — и
  # значит НЕ СМОЖЕТ пройти до тех пор, пока `feat/e2e-support` не будет
  # влита в default branch Backend-репозитория. Порядок обязателен: сначала
  # мерж Backend-ветки, потом (или одновременно) этот workflow может стать
  # зелёным — если смотреть на первый зелёный прогон этой джобы раньше, чем
  # на мерж Backend, это будет означать, что она либо ещё не запускалась
  # по-настоящему, либо чекаутит не тот код, который вы думаете. Шаг
  # "Preflight: e2e-stand-up target exists" ниже ловит именно это несоответствие
  # с понятным сообщением вместо голого "No rule to make target".
  # ============================================================
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend (this repo)
        uses: actions/checkout@v4

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: IVR-CBDC/Backend
          path: backend
          # Если/когда Backend-репозиторий станет приватным на GitHub, сюда
          # понадобится `token: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}` —
          # `secrets.GITHUB_TOKEN` этого воркфлоу не имеет доступа к другому
          # репозиторию организации по умолчанию.

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      # F8 (final review, сделать заодно): раньше в e2e/ не было скрипта
      # typecheck и ни одна джоба его не гоняла — ошибки типов в спеках
      # всплывали только в рантайме, внутри многоминутной e2e-джобы, вместо
      # того чтобы падать за секунды.
      - name: Typecheck e2e specs
        working-directory: e2e
        run: pnpm typecheck

      # Кэш браузерных бинарников Playwright (не системных apt-зависимостей,
      # их --with-deps всё равно ставит заново каждый раз — они не в этом
      # каталоге) — ключ по lockfile'у e2e/, где закреплена версия
      # @playwright/test, так что смена версии сама инвалидирует кэш.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install Playwright (chromium + system deps)
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@v3

      # gen-keys.sh конвертирует PEM -> JWK через python3 + cryptography
      # (тот же скрипт и та же причина явной установки, что в Backend-
      # репозитории: GitHub не гарантирует cryptography в системном python3
      # ubuntu-latest). Сам gen-keys.sh запускать здесь не нужно — его
      # вызывает `make e2e-stand-up` ниже (цель `keys`, идемпотентна).
      - name: Install python3 + cryptography (for Backend's gen-keys.sh)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 python3-cryptography

      - name: Build bff image
        uses: docker/build-push-action@v5
        with:
          context: bff
          file: bff/Dockerfile
          tags: bff-ci:latest
          load: true
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: frontend-ci:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ПЛАН 08 (Task 4) — ДОЛГ ПЛАНА 07 ЗАКРЫТ: backend-образы тянутся
      # готовыми, а не собираются здесь.
      #
      # Что было раньше и почему это было неправильно. Здесь стоял шаг
      # «Restore/build ivr-cpp-base», а `make e2e-stand-up` вызывался с
      # `--build`, то есть каждый PR фронт-репозитория собирал C++ трёх
      # чужих сервисов полным cmake поверх drogon. На тёплом кэше GHA это
      # минуты, на холодном — 25-40 минут на джобу. И главное: эта сборка
      # ничего не проверяла. Код Backend в PR фронта не менялся, его
      # тестирует его собственный CI.
      #
      # Что теперь. CD Backend (`.github/workflows/deploy.yml`, план 08
      # Task 3) на каждый push в main публикует service-auth/service-core/
      # service-commission в ghcr двумя тегами: `sha-<7>` — им выкатывается
      # стенд, и плавающим `:main` — он для нас. Плавающий тег здесь не
      # дефект, а единственно возможный выбор: sha коммита Backend этому
      # прогону неизвестен и узнать его неоткуда (чекаут ниже берёт ветку
      # по умолчанию). Для ВЫКАТА плавающий тег запрещён и отвергается
      # `infra/k3s-preflight.sh`; здесь речь про эфемерный стенд одной
      # джобы, где воспроизводимость даёт не тег, а то, что образ собран из
      # той же ветки main, что и чекаут Backend выше.
      #
      # `ivr-cpp-base` больше не нужен вовсе: он был нужен как база для
      # сборки, а сборки здесь нет.
      - name: Log in to ghcr (backend images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Пакеты Backend-репозитория принадлежат другому репозиторию
          # организации: если они не публичные, GITHUB_TOKEN этого workflow
          # их не увидит и `docker pull` упадёт на 403 — тогда сюда нужен
          # PAT с read:packages в secrets.GHCR_READ_TOKEN.
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # Быстрый путь — стянуть готовые образы. Он работает, только если
      # пакеты Backend-репозитория доступны этому прогону (публичные либо
      # выдан secrets.GHCR_READ_TOKEN). Пока это не так, джоба НЕ падает:
      # Backend — публичный репозиторий, его исходники уже лежат в
      # ./backend (чекаут выше), и стенд можно собрать из них. Это дольше
      # (C++ через ivr-cpp-base), но CI остаётся зелёным без ручных
      # действий в настройках GitHub, а как только доступ появится, шаг сам
      # вернётся на быстрый путь — менять ничего не нужно.
      #
      # Почему не «просто всегда собирать»: сборка drogon+libjwt без кэша
      # это ~19 минут (замер плана 04), и ради этого шаг когда-то и
      # переводили на pull. Выбор пути делается по факту, а не по
      # предположению о настройках.
      - name: Pull backend images (fall back to building them)
        id: backend-images
        env:
          BACKEND_IMAGE_PREFIX: ghcr.io/ivr-cbdc/backend
          BACKEND_IMAGE_TAG: main
        run: |
          set -euo pipefail
          for s in service-auth service-core service-commission; do
            ref="$BACKEND_IMAGE_PREFIX/$s:$BACKEND_IMAGE_TAG"
            echo "::group::pull $ref"
            if ! docker pull "$ref"; then
              echo "::endgroup::"
              echo "::warning::$ref недоступен этому прогону — стенд будет собран" \
                   "из исходников ./backend. Обычно значит, что пакет приватный:" \
                   "сделайте пакеты ghcr публичными или выдайте secrets.GHCR_READ_TOKEN" \
                   "с read:packages, и шаг вернётся на быстрый путь."
              echo "mode=build" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
          done
          echo "mode=pull" >> "$GITHUB_OUTPUT"

      # Образы не стянулись — собираем. Базовый образ C++ собирается один
      # раз и переиспользуется всеми тремя сервисами (план 04), иначе
      # каждый тянул бы drogon и libjwt заново.
      # Собранные образы тегируются ТЕМИ ЖЕ именами, что и стянутые:
      # в docker-compose.yml у сервисов `image: ${SERVICE_*_IMAGE:-…}`, и
      # compose при сборке ставит этот тег. Поэтому следующий шаг
      # (`make e2e-stand-up` с пустым E2E_BUILD) находит их локально и не
      # идёт в реестр — подъём стенда одинаков для обоих путей и правок не
      # требует.
      - name: Build backend images from source
        if: steps.backend-images.outputs.mode == 'build'
        working-directory: backend
        env:
          SERVICE_AUTH_IMAGE: ghcr.io/ivr-cbdc/backend/service-auth:main
          SERVICE_CORE_IMAGE: ghcr.io/ivr-cbdc/backend/service-core:main
          SERVICE_COMMISSION_IMAGE: ghcr.io/ivr-cbdc/backend/service-commission:main
        run: |
          set -euo pipefail
          make cpp-base
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            build service-auth service-core service-commission
          # Доказательство, что теги совпали с ожидаемыми: иначе стенд пойдёт
          # в реестр за отсутствующим образом и упадёт дальше от причины.
          for s in service-auth service-core service-commission; do
            docker image inspect "ghcr.io/ivr-cbdc/backend/$s:main" >/dev/null
          done

      # F (review round 1, важная находка): раньше здесь дублировался сырой
      # `docker compose ... --profile bff --profile frontend up -d --build
      # --wait` с EMULATOR_MANUAL=true в env шага — второй источник правды
      # рядом с `make e2e-stand-up` (Backend-репозиторий, добавлена той же
      # задачей 3), который мог разойтись с ним и молча вернуть ту самую
      # ловушку из плана 07/задачи 2 (`EMULATOR_MANUAL` тихо сбрасывается в
      # false). Теперь джоба вызывает саму `make e2e-stand-up` — один
      # источник правды: EMULATOR_MANUAL=true зашито в самой цели Makefile,
      # а не повторено здесь текстом. `ivr-cpp-base:latest` уже загружен
      # шагом выше, поэтому проверка `docker image inspect` внутри цели
      # находит его и не пересобирает.
      # F2 (final review): без этого шага "No rule to make target
      # 'e2e-stand-up'" — единственный симптом, если Backend-чекаут выше
      # (ветка по умолчанию, см. комментарий над джобой `e2e`) ещё не
      # содержит `feat/e2e-support` (или её эквивалент после мержа). `make -n`
      # ничего не выполняет (dry-run), только парсит Makefile и печатает, что
      # бы он сделал — дешёвая, мгновенная проверка перед тратой минут на
      # сборку образов и стенд.
      - name: Preflight — e2e-stand-up target exists
        working-directory: backend
        run: |
          make -n e2e-stand-up || {
            echo "::error::make e2e-stand-up не найдена в чекауте Backend-репозитория." \
                 "Обычно значит: ветка feat/e2e-support (план 07, задача 3) ещё не влита" \
                 "в default branch Backend — см. комментарий над джобой e2e в этом файле" \
                 "про обязательный порядок мержа."
            exit 1
          }

      - name: Bring up stand (make e2e-stand-up, bff/frontend from this checkout)
        working-directory: backend
        env:
          # Пустой E2E_BUILD = `docker compose up` без `--build`: ничего не
          # собираем, все пять образов уже в локальном сторе демона (bff и
          # frontend — `load: true` шагами сборки выше, три backend-сервиса —
          # `docker pull`). Прежний трюк с BUILDX_BUILDER=default здесь
          # больше не нужен: он существовал только ради того, чтобы сборка
          # внутри compose видела image store демона, а сборки внутри
          # compose теперь нет.
          E2E_BUILD: ""
          BFF_IMAGE: bff-ci:latest
          FRONTEND_IMAGE: frontend-ci:latest
          # Те же переменные, что и в docker-compose.yml Backend (план 08,
          # Task 4): имя образа каждого собираемого там сервиса
          # параметризовано именно ради этого случая.
          SERVICE_AUTH_IMAGE: ghcr.io/ivr-cbdc/backend/service-auth:main
          SERVICE_CORE_IMAGE: ghcr.io/ivr-cbdc/backend/service-core:main
          SERVICE_COMMISSION_IMAGE: ghcr.io/ivr-cbdc/backend/service-commission:main
        run: make e2e-stand-up

      - name: Run Playwright suite
        working-directory: e2e
        run: pnpm test

      # F8 (final review, сделать заодно): раньше compose-логи писались в
      # /tmp/e2e-compose-logs.txt — отдельный корень от e2e/playwright-report
      # и e2e/test-results (внутри воркспейса, GITHUB_WORKSPACE). actions/upload-artifact
      # объединяет несколько корней архивом с их общим префиксом путей,
      # поэтому файл из /tmp получал вложенный путь на несколько уровней
      # глубже, чем нужно. Пишем лог в воркспейс (backend/e2e-compose-logs.txt),
      # рядом с остальными артефактами падения — единый корень, плоский архив.
      - name: Dump backend compose logs on failure
        if: failure()
        working-directory: backend
        run: |
          # Тот же набор `-f`, которым поднят стенд (план 08 добавил
          # docker-compose.e2e.yml). Расхождение здесь не сломало бы прогон,
          # но compose ругался бы на неизвестные ему контейнеры проекта.
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml \
            --profile bff --profile frontend logs > e2e-compose-logs.txt 2>&1 || true

      - name: Upload failure artifacts (traces, report, compose logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            backend/e2e-compose-logs.txt
          if-no-files-found: ignore
