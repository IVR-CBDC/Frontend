name: Publish images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bff
            context: bff
          - service: spa
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ivr-cbdc/frontend/${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/ivr-cbdc/frontend/${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/IVR-CBDC/Frontend
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=prod-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.service }}

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Request Backend release after both frontend images are published
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::Missing BACKEND_DISPATCH_TOKEN: images published, Backend notification unavailable."
            echo "First setup missing: BACKEND_DISPATCH_TOKEN (fine-grained Contents: write on Backend)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -n --arg sha "$SOURCE_SHA" '{event_type:"frontend-images",client_payload:{source_sha:$sha}}' > /tmp/dispatch.json
          gh api --method POST repos/IVR-CBDC/Backend/dispatches --input /tmp/dispatch.json
